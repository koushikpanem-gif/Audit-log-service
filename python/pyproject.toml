[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-log-service"
version = "0.1.0"
description = "Python service scaffold for the tamper-evident audit log assignment"
requires-python = ">=3.11"
dependencies = [
    "starlette==1.8.0",
    "pydantic==2.14.1",
    "cryptography==50.0.2",
    "uvicorn==0.54.0",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.13.1",
    "jsonschema==4.26.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audit_log_service = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["e2e: starts real service processes (Java jar and Python) over HTTP"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
