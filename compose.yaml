# Provision keys first (see docs/setup.md):
#   python scripts/provision_keys.py --output-dir deploy/keys/java
# Build the jar first:  mvn -f java/pom.xml verify
# NOTE: not exercised in the authoring environment (Docker was unavailable).
services:
  audit-java:
    build:
      context: .
      dockerfile: java/Dockerfile
    environment:
      AUDIT_LEDGER_ID: audit-java-ledger
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - java-data:/var/lib/audit/data
      - java-archives:/var/lib/audit/archives
      - java-exports:/var/lib/audit/exports
      - ./deploy/keys/java:/etc/audit/keys:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  java-data:
  java-archives:
  java-exports:
