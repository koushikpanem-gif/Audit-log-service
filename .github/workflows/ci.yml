name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag in the comment), resolved from the GitHub
# API on 2026-10-18. Update deliberately and re-record in docs/quality-gates.md.
jobs:
  java:
    name: Java verify (enforcer, spotless, tests, jacoco gate, spotbugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f java/pom.xml verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-log-jar
          path: java/target/audit-log-service-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: java/target/site/jacoco
          retention-days: 7

  java-dependency-scan:
    name: Java dependency scan (OWASP dependency-check, NVD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Needs the NVD_API_KEY repository secret. GitHub exports an unset secret as an empty
      # variable, which the plugin also reads and rejects, so the scan is skipped with a
      # visible warning when the secret is missing (see docs/quality-gates.md).
      - env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            unset NVD_API_KEY
            echo "::warning title=Dependency scan skipped::Add the NVD_API_KEY repository secret to enable the OWASP dependency-check."
            exit 0
          fi
          mvn -B -f java/pom.xml -Psecurity-scan org.owasp:dependency-check-maven:13.0.0:check -DnvdApiKey="$NVD_API_KEY"

  hygiene:
    name: Secret and artifact hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python scripts/check_hygiene.py

  images:
    name: Build service image and prove prod fails closed
    needs: java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audit-log-jar
          path: java/target
      - run: docker build -f java/Dockerfile -t audit-log-java:ci .
      - name: Image runs as non-root
        run: |
          test "$(docker run --rm --entrypoint id audit-log-java:ci -u)" = "10001"
      - name: Production without mounted keys must not start
        run: |
          if docker run --rm audit-log-java:ci; then exit 1; fi
