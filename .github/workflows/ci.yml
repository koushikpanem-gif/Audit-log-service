name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag in the comment), resolved from the GitHub
# API on 2026-10-18. Update deliberately and re-record in docs/quality-gates.md.
jobs:
  java:
    name: Java verify (enforcer, spotless, tests, jacoco gate, spotbugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f java/pom.xml verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-log-jar
          path: java/target/audit-log-service-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: java/target/site/jacoco
          retention-days: 7

  java-dependency-scan:
    name: Java dependency scan (OWASP dependency-check, NVD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Needs the NVD_API_KEY repository secret; without it NVD rate limits can fail the
      # job. That failure is reported, not suppressed (see docs/quality-gates.md).
      - run: >
          mvn -B -f java/pom.xml -Psecurity-scan
          org.owasp:dependency-check-maven:13.0.0:check
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}

  python:
    name: Python quality gates (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: bandit -c pyproject.toml -r src -ll
      - run: pip-audit --skip-editable
      # e2e tests start real processes and run in the e2e job; the coverage gate is
      # fail_under in pyproject.toml.
      - run: python -m pytest -m "not e2e" --cov --cov-report=term

  verifier-minimal:
    name: Verifier installs with cryptography only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m venv /tmp/verifier-venv && /tmp/verifier-venv/bin/pip install ./python
      - run: |
          /tmp/verifier-venv/bin/pip list --format=freeze
          /tmp/verifier-venv/bin/python -c "import sys, audit_log_service.verifier; bad=[m for m in ('starlette','pydantic','uvicorn','rfc8785') if m in sys.modules]; assert not bad, bad"
          status=0
          /tmp/verifier-venv/bin/python -m audit_log_service.verifier --bundle /nonexistent.json --allow-self-asserted || status=$?
          test "$status" -eq 2

  e2e:
    name: Cross-process e2e and prod fail-closed (Java jar + Python)
    needs: java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audit-log-jar
          path: java/target
      - run: python -m pip install -e "python[dev]"
      - run: python -m pytest -m e2e
        working-directory: python

  hygiene:
    name: Secret and artifact hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python scripts/check_hygiene.py

  images:
    name: Build service images and prove prod fails closed
    needs: java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audit-log-jar
          path: java/target
      - run: docker build -f java/Dockerfile -t audit-log-java:ci .
      - run: docker build -f python/Dockerfile -t audit-log-python:ci .
      - name: Images run as non-root
        run: |
          test "$(docker run --rm --entrypoint id audit-log-java:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint id audit-log-python:ci -u)" = "10001"
      - name: Production without mounted keys must not start
        run: |
          if docker run --rm audit-log-java:ci; then exit 1; fi
          if docker run --rm audit-log-python:ci; then exit 1; fi
